<meta charset="utf-8">
<!-- ============================================================
     TURNIT — MODULE QUIZ (funnel page)
     Paste into a GHL FUNNEL PAGE > Custom Code / HTML, then iframe it.
     Scoped under #tn-qz. Brand: blue #1568AE -> green #209B73 | Poppins + Inter.

     Covers INTERMEDIATE MODULE 1 — Building A Real Portfolio:
       01 From One Fund To An Allocation
       02 Stocks And Bonds: Choosing Your Split
       03 Why International Exposure Exists
       04 Large, Mid, And Small Companies
       05 Three Portfolio Models Compared
     10 questions, 2 per lesson, split 4 easy / 4 medium / 2 hard — the
     same ratio the Foundations-course quizzes (1-9 through 5-8) use.
     Answer key spread across all four letters (A:3 B:2 C:3 D:2) rather
     than clustering on one letter. Option lengths are enforced, not just
     eyeballed: quiz-static-checks.py fails a quiz where the correct
     option is the strict longest (or shortest) in more than 3 of 10
     questions, or where any option in a question is over 2x the length
     of the shortest. An earlier pass claimed this was handled by eye and
     wasn't — 69/70 questions across the first build of all 7 Intermediate
     quizzes had the longest option be the correct one. This file was
     rewritten to fix that, and the checker now exists so it can't recur
     silently.

     ENGINE: this is the exact same shared `tn-qz` engine used by every
     Foundations module quiz (see e.g. `5-8-module-5-quiz.html` at the
     repo root), copied forward on purpose — quizzes are standalone
     funnel pages, not lessons, so the usual per-lesson prefix-collision
     rule doesn't apply here; all seven Intermediate module quizzes
     share this same `tn-qz` prefix, exactly as all five Foundations
     quizzes already do. One real bug fixed in the copied engine: the
     intro screen used to hard-code "covering all 7 lessons in this
     module" (true for every Foundations module, which all have 7
     lessons). Every Intermediate module has 5 lessons, so left
     unfixed, every one of these seven quizzes would have opened on a
     false sentence. The lesson count is now computed from the
     question set's own distinct `lesson` values instead of hard-coded.

     Every question is drawn directly from this module's five shipped
     lesson files — their title-chip definitions, their Myth/Fact rows
     (verified true/false claims), and their sort-activity answer keys
     — not from memory, and distractors are drawn from each lesson's
     own myths (already verified wrong) rather than invented options.
     No time-sensitive figures (rates, limits, dated statistics) appear
     as correct answers anywhere in this module's content, so none
     appear here either.

     TO MAKE A QUIZ FOR ANOTHER MODULE: edit only the QUIZ config in
     the QUIZ CONFIG script block (title, lesson name, questions).
     Everything else is shared and does not need to change.

     Flow: intro screen -> one question at a time with instant feedback
     -> one try per question -> results with a per-question review ->
     scroll-down prompt pointing at GHL's own Mark As Complete / Next
     buttons.
     ============================================================ -->

<script>
/* ============================================================
   QUIZ CONFIG — the only part to edit per module.
   a = index of the correct option (0 = A, 1 = B, ...).
   topic = short label shown in the results review.
   lesson = which lesson to revisit, shown for missed questions.
   diff = easy / medium / hard — 4 easy, 4 medium, 2 hard per quiz.
   ============================================================ */
var QUIZ = {
  lesson: "Module 1: Building A Real Portfolio",
  questions: [
    { topic:"What asset allocation means", diff:"easy",
      q:"What does “asset allocation” mean?",
      o:["Which brokerage you use","How many stocks you own","How your money is split across asset classes","Your portfolio's total dollar value"], a:2,
      e:"Asset allocation is the split itself — stocks vs. bonds vs. cash — not which funds you used to get there.",
      lesson:"01 · From One Fund To An Allocation" },
    { topic:"Growth engines vs. stabilizers", diff:"medium",
      q:"Which of these is a growth engine, not a stabilizer?",
      o:["A total market stock fund","A money market fund","Short-term government bonds","A high-yield savings account"], a:0,
      e:"A total market stock fund is a growth engine; money market funds, short-term government bonds, and savings accounts are all stabilizers.",
      lesson:"01 · From One Fund To An Allocation" },
    { topic:"Risk capacity vs. risk tolerance", diff:"easy",
      q:"What's the difference between risk capacity and risk tolerance?",
      o:["They're basically the same thing","Capacity only applies to retirees","Tolerance is dollars, capacity is percentages","Capacity is arithmetic; tolerance is temperament"], a:3,
      e:"Risk capacity is driven by your timeline and income — arithmetic. Risk tolerance is how much loss you can live through without selling — temperament.",
      lesson:"02 · Stocks And Bonds: Choosing Your Split" },
    { topic:"When capacity overrides tolerance", diff:"hard",
      q:"Money's needed in 3 years; they feel fine going all-stock. What should guide the split?",
      o:["Their stated risk tolerance","Their risk capacity, not their tolerance","Their age, not their timeline","Whichever split returned most historically"], a:1,
      e:"Tolerance is only half of it — a near-term goal means capacity for loss is what actually binds, no matter how comfortable someone feels with risk.",
      lesson:"02 · Stocks And Bonds: Choosing Your Split" },
    { topic:"What home bias means", diff:"easy",
      q:"What is “home bias”?",
      o:["Overweighting your own country's stocks","Preferring companies you personally worked for","A tax break for domestic investments","The risk a foreign currency falls"], a:0,
      e:"Home bias is holding more of your home country's stocks than its actual share of the global market — common everywhere, not just the US.",
      lesson:"03 · Why International Exposure Exists" },
    { topic:"Foreign revenue vs. foreign ownership", diff:"medium",
      q:"A US company earns most revenue overseas. Does its stock diversify you internationally?",
      o:["Yes — revenue abroad means ownership abroad","Yes, if it's in a major index","No — it still trades on a US exchange","No — foreign revenue is taxed differently"], a:2,
      e:"Foreign revenue isn't foreign ownership — the stock itself still trades on a US exchange and moves with US markets.",
      lesson:"03 · Why International Exposure Exists" },
    { topic:"What market cap measures", diff:"easy",
      q:"How is market cap calculated?",
      o:["A company's annual revenue","Its number of employees","Its total debt minus assets","Share price times shares outstanding"], a:3,
      e:"Market cap is share price times shares outstanding — the market's price tag on the whole business.",
      lesson:"04 · Large, Mid, And Small Companies" },
    { topic:"How spread out a cap-weighted fund really is", diff:"hard",
      q:"A cap-weighted fund holds thousands of companies. How spread out are you really?",
      o:["Perfectly — equal exposure to every company","Less than it looks — a few giants dominate","Only across large-cap companies","Not related to company size at all"], a:1,
      e:"Owning thousands of companies sounds broad, but cap-weighting means the biggest names dominate the fund's actual behavior — breadth of holdings isn't breadth of exposure.",
      lesson:"04 · Large, Mid, And Small Companies" },
    { topic:"What a glide path is", diff:"medium",
      q:"What is a “glide path”?",
      o:["The overall market's historical return pattern","A chart of a fund's daily price","A target-date fund's bond-shift schedule","The order a broker executes trades"], a:2,
      e:"A glide path is the published schedule a target-date fund follows, reducing stocks and adding bonds over time — and it varies by provider.",
      lesson:"05 · Three Portfolio Models Compared" },
    { topic:"Sizing a satellite position", diff:"medium",
      q:"In core-and-satellite investing, how big should a satellite position be?",
      o:["Small — so being wrong doesn't hurt much","Roughly half of the total portfolio value","Equal in size to the core","All in cash, for safety"], a:0,
      e:"Satellites are kept deliberately small — the core is supposed to be most of the portfolio, and a satellite being wrong should sting, not sink you.",
      lesson:"05 · Three Portfolio Models Compared" }
  ]
};
</script>
<script>
/* ============================================================
   QUIZ ENGINE — shared; no edits needed per module.
   One try per question. Correct answers move on automatically;
   wrong answers show why, then wait for the learner to continue.
   ============================================================ */
(function(){
  var root=document.getElementById('tn-qz'); if(!root || !window.QUIZ) return;
  var card=root.querySelector('#qz-card'), bar=root.querySelector('#qz-bar'),
      metaL=root.querySelector('#qz-meta-l'), metaR=root.querySelector('#qz-meta-r');
  var Q=QUIZ.questions, N=Q.length, L=['A','B','C','D','E'];
  var idx, result, correct;               /* result[i] = true / false once answered */
  var ADVANCE_MS=1800, advanceTimer=null;
  function clearAdvance(){ if(advanceTimer){ clearTimeout(advanceTimer); advanceTimer=null; } }

  /* distinct lessons this question set actually covers, computed rather than
     hard-coded — a fixed "7 lessons" string (true for every Foundations
     module) would be wrong for every Intermediate module, which has 5 */
  var LESSON_COUNT=(function(){ var seen={}, n=0; Q.forEach(function(q){ if(!seen[q.lesson]){ seen[q.lesson]=1; n++; } }); return n; })();

  function postH(){ var h=root.scrollHeight+40; if(window.parent) window.parent.postMessage({turnitLessonHeight:h},'*'); }
  function toTop(){ if(window.parent) window.parent.postMessage({turnitScrollTop:1},'*'); try{ window.scrollTo(0,0); }catch(e){} }
  function paint(html){ card.innerHTML=html; card.style.animation='none'; void card.offsetWidth; card.style.animation=''; postH(); }

  function intro(){
    metaL.textContent='Ready when you are'; metaR.textContent=''; bar.style.width='0%';
    paint(
      '<p class="qz-kicker">Module Quiz</p>'+
      '<h1 class="qz-title">'+QUIZ.lesson.replace(/ (\S+)$/,' <span class="qz-grad">$1</span>')+'</h1>'+
      '<p class="qz-sub">See how well this module’s big ideas stuck — '+N+' questions covering all '+LESSON_COUNT+' lessons in this module.</p>'+
      '<div class="qz-rule">Get one wrong and you’ll see why before moving on.</div>'+
      '<button type="button" class="qz-btn" id="qz-start">Start the Quiz →</button>');
    card.querySelector('#qz-start').addEventListener('click',start);
  }

  function start(){ clearAdvance(); idx=0; correct=0; result=Q.map(function(){return null;}); toTop(); ask(); }

  function dots(cur){
    return '<div class="qz-dots">'+Q.map(function(_,i){
      var c=result[i]===true?'ok':(result[i]===false?'miss':'');
      return '<span class="qz-dot '+c+(i===cur?' cur':'')+'"></span>'; }).join('')+'</div>';
  }

  function ask(){
    clearAdvance();
    if(idx>=N) return results();
    var q=Q[idx];
    metaL.textContent='Question '+(idx+1)+' of '+N;
    metaR.textContent=correct+' correct';
    bar.style.width=Math.round(idx/N*100)+'%';
    paint(
      '<div class="qz-qhead">'+dots(idx)+'</div>'+
      '<p class="qz-q">'+q.q+'</p>'+
      '<div class="qz-opts">'+q.o.map(function(t,k){
        return '<button type="button" class="qz-opt" data-k="'+k+'"><span class="qz-l">'+L[k]+'</span><span>'+t+'</span></button>'; }).join('')+'</div>'+
      '<div class="qz-fb" hidden></div>');
    card.querySelectorAll('.qz-opt').forEach(function(b){
      b.addEventListener('click',function(){ pick(+b.getAttribute('data-k')); });
    });
  }

  function pick(k){
    var q=Q[idx], ok=(k===q.a);
    card.querySelectorAll('.qz-opt').forEach(function(b){
      var kk=+b.getAttribute('data-k'); b.disabled=true;
      b.classList.add(kk===q.a?'right':(kk===k?'wrong':'dim'));
    });
    result[idx]=ok; if(ok) correct++;
    card.querySelector('.qz-dots').outerHTML=dots(-1);
    metaR.textContent=correct+' correct';
    bar.style.width=Math.round((idx+1)/N*100)+'%';
    idx++;
    var last=idx>=N, fb=card.querySelector('.qz-fb'); fb.hidden=false; fb.className='qz-fb '+(ok?'ok':'no');
    if(ok){
      fb.innerHTML='<b>Correct!</b> '+(last?'Getting your results…':'Moving to the next question…')+'<span class="qz-timer"><span></span></span>';
      advanceTimer=setTimeout(ask, ADVANCE_MS);
    } else {
      fb.innerHTML='<b>Not quite — the answer is '+L[q.a]+'.</b> '+q.e+
        '<button type="button" class="qz-btn" id="qz-go">'+(last?'See My Results →':'Next Question →')+'</button>';
      fb.querySelector('#qz-go').addEventListener('click',ask);
    }
    postH();
  }

  function results(){
    metaL.textContent='Quiz complete'; metaR.textContent=correct+' of '+N+' correct'; bar.style.width='100%';
    var pct=correct/N, C=2*Math.PI*62, off=C*(1-pct);
    var lead=pct===1?'Perfect score.':(pct>=.7?'Strong work.':(pct>=.4?'Good start.':'Worth another look.'));
    var sub=pct===1?'Every idea in this module landed.':
      'You got '+correct+' of '+N+'. The ones marked below are worth revisiting in the lesson.';
    paint(
      '<div class="qz-ringwrap"><svg class="qz-ring" viewBox="0 0 150 150"><defs><linearGradient id="qz-grad" x1="0" x2="1">'+
      '<stop offset="0" stop-color="#1568AE"/><stop offset="1" stop-color="#209B73"/></linearGradient></defs>'+
      '<circle cx="75" cy="75" r="62" class="bg"/><circle cx="75" cy="75" r="62" class="fg" style="stroke-dasharray:'+C+';stroke-dashoffset:'+C+'"/></svg>'+
      '<div class="qz-score"><b>'+correct+'/'+N+'</b><span>Correct</span></div></div>'+
      '<p class="qz-lead">'+lead+'</p><p class="qz-leadsub">'+sub+'</p>'+
      '<div class="qz-review">'+Q.map(function(q,i){
        var hit=result[i]===true;
        return '<div class="qz-rv"><span class="qz-rvi '+(hit?'ok':'miss')+'">'+(hit?'✓':'✕')+'</span><div><b>'+q.topic+'</b>'+
          (hit?'<small>Got it</small>':'<small>Answer: '+q.o[q.a]+'</small><small class="qz-why">'+q.e+'</small><small class="qz-revisit">↺ Revisit '+q.lesson+'</small>')+'</div></div>'; }).join('')+'</div>'+
      '<div class="qz-finish"><span class="qz-arrow" id="qz-arrow">↓</span>'+
      '<p class="qz-flead" id="qz-flead">Scroll Down To Continue</p>'+
      '<p class="qz-fsub" id="qz-fsub">Just below this window, click <b>Mark As Complete</b>, then <b>Next Lesson</b>.</p></div>');
    var fg=card.querySelector('.fg');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ fg.style.strokeDashoffset=off; }); });
    fsApply(true);
    confetti();
  }

  /* ---- celebration: confetti falls from the top of the screen ----
     Canvas is attached to <body>, not the quiz card: the card animates with a
     transform, which would trap a fixed-position overlay inside it.
     Skipped entirely for learners who have reduced motion turned on. */
  function confetti(){
    try{ if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
    var old=document.getElementById('qz-confetti'); if(old) old.remove();
    var cv=document.createElement('canvas'); cv.id='qz-confetti';
    cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
    document.body.appendChild(cv);
    var ctx=cv.getContext('2d'), dpr=Math.min(window.devicePixelRatio||1,2), W, H;
    function size(){ W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    size(); window.addEventListener('resize',size);
    var COLORS=['#1568AE','#209B73','#E0A93C','#12a08a','#5AA9E6','#F2C14E'];
    var P=[], COUNT=Math.min(160, Math.round(W/3));
    for(var i=0;i<COUNT;i++){
      P.push({ x:Math.random()*W, y:-20-Math.random()*H*0.6,
        w:6+Math.random()*6, h:8+Math.random()*8, c:COLORS[i%COLORS.length],
        vy:2.2+Math.random()*2.8, vx:-1.2+Math.random()*2.4,
        rot:Math.random()*Math.PI, vr:-0.12+Math.random()*0.24,
        sway:Math.random()*Math.PI*2, round:Math.random()<0.25 });
    }
    var start=performance.now(), LIFE=4200;
    (function frame(now){
      var t=now-start; ctx.clearRect(0,0,W,H);
      var fade=t>LIFE-900?Math.max(0,(LIFE-t)/900):1;
      P.forEach(function(p){
        p.sway+=0.05; p.x+=p.vx+Math.sin(p.sway)*0.8; p.y+=p.vy; p.rot+=p.vr;
        ctx.save(); ctx.globalAlpha=fade; ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c;
        if(p.round){ ctx.beginPath(); ctx.arc(0,0,p.w/2,0,Math.PI*2); ctx.fill(); }
        else ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.sway)));  /* flutter */
        ctx.restore();
      });
      if(t<LIFE) requestAnimationFrame(frame);
      else { window.removeEventListener('resize',size); cv.remove(); }
    })(start);
  }


  /* full-screen aware finish prompt, same behavior as the lessons */
  var lastFs=null;
  function isFs(){
    try{ if(document.fullscreenElement||document.webkitFullscreenElement) return true; }catch(e){}
    try{ var s=window.screen; return innerHeight>=(s.availHeight||s.height)-130 && innerWidth>=(s.availWidth||s.width)-60; }catch(e){ return false; }
  }
  function fsApply(force){
    var a=card.querySelector('#qz-arrow'); if(!a) return;
    var fs=isFs(); if(!force && fs===lastFs) return; lastFs=fs;
    a.textContent=fs?'↑':'↓'; a.classList.toggle('up',fs);
    card.querySelector('#qz-flead').textContent=fs?'Close Full Screen To Continue':'Scroll Down To Continue';
    card.querySelector('#qz-fsub').innerHTML=fs?'Tap the <b>✕</b> in the top corner, then click <b>Mark As Complete</b> and <b>Next Lesson</b>.'
      :'Just below this window, click <b>Mark As Complete</b>, then <b>Next Lesson</b>.';
  }
  window.addEventListener('resize',function(){ fsApply(false); });
  document.addEventListener('fullscreenchange',function(){ fsApply(false); });

  window.addEventListener('load',postH); window.addEventListener('resize',postH);
  intro();
})();
</script>
